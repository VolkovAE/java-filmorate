server.port=8080
########################################################################################################################
#
#\u041D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438 \u043B\u043E\u0433\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u044F
logging.level.ru=INFO
#logging.level.ru.yandex.practicum.filmorate=WARN
#logging.level.ru.yandex.practicum.filmorate.service=INFO
#logging.level.ru.yandex.practicum.filmorate.storage=OFF
spring.output.ansi.enabled=ALWAYS
logging.level.org.zalando.logbook=TRACE
########################################################################################################################
#
#\u041D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438 \u0434\u043B\u044F \u0440\u0430\u0431\u043E\u0442\u044B \u0441 \u0411\u0414
# \u0434\u043B\u044F \u0441\u043E\u0437\u0434\u0430\u043D\u0438\u044F \u0441\u0445\u0435\u043C\u044B \u0411\u0414, \u0438\u043D\u0438\u0446\u0438\u0430\u043B\u0438\u0437\u0430\u0446\u0438\u0438 \u0411\u0414 \u043D\u0430 \u043E\u0441\u043D\u043E\u0432\u0435 \u0441\u043A\u0440\u0438\u043F\u0442\u043E\u0432 \u0443\u0441\u0442\u0430\u043D\u043E\u0432\u0438\u043C \u0440\u0435\u0436\u0438\u043C
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.sql.init.schema-locations=classpath:/DB/DDL/schema.sql
spring.sql.init.data-locations=classpath:/DB/Init/data.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# \u0432 jdbc-url \u0443\u043A\u0430\u0436\u0438\u0442\u0435, \u0447\u0442\u043E \u0434\u0430\u043D\u043D\u044B\u0435 \u043D\u0443\u0436\u043D\u043E \u0441\u043E\u0445\u0440\u0430\u043D\u044F\u0442\u044C \u0432 \u0444\u0430\u0439\u043B
spring.datasource.url=jdbc:h2:file:./db/filmorate;MODE=PostgreSQL;
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
# \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
